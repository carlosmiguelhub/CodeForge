# Each API keeps its own subdomain (not one shared domain with path
# routing) to match how the frontend already treats them as separate
# origins (NEXT_PUBLIC_PLATFORM_API_URL / _EXECUTION_API_URL /
# _INTERACTIVE_RUN_API_URL are each a full base URL, and
# SQWEB_ALLOWED_ORIGINS-based CORS already assumes cross-origin calls).
#
# TLS note: this is still HTTP-only. Once certbot has issued real certs
# (see DEPLOY.md step 7), a second version of this file adds "listen 443
# ssl" blocks — can't add those yet, nginx would fail to start referencing
# cert files that don't exist until certbot has actually run once.

server {
    listen 80;
    server_name api.code-forge.online;

    # Let's Encrypt's HTTP-01 challenge — certbot writes a token here via
    # the shared codeforge_certbot_www volume, and needs to reach it over
    # plain HTTP before any cert exists. Must come before location / so it
    # isn't swallowed by the proxy_pass catch-all below.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://platform-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name exec.code-forge.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://execution-api:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name run.code-forge.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://interactive-run-api:8084;
        proxy_http_version 1.1;
        # Interactive runs are a live WebSocket, not a request/response API
        # — without this Upgrade/Connection pair nginx proxies it as a
        # plain HTTP request and the socket handshake never completes.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A run can sit idle waiting for stdin for a while — don't let
        # nginx's default 60s read timeout kill a live console session.
        proxy_read_timeout 600s;
    }
}
