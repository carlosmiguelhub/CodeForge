# Each API keeps its own subdomain (not one shared domain with path
# routing) to match how the frontend already treats them as separate
# origins (NEXT_PUBLIC_PLATFORM_API_URL / _EXECUTION_API_URL /
# _INTERACTIVE_RUN_API_URL are each a full base URL, and
# SQWEB_ALLOWED_ORIGINS-based CORS already assumes cross-origin calls).
#
# All three subdomains share ONE cert (issued with -d api... -d exec...
# -d run... in a single certbot call), stored under api.code-forge.online's
# directory — that's normal certbot behavior for a multi-SAN cert, not a
# mistake; don't split it into three separate certs later without reason.

server {
    listen 80;
    server_name api.code-forge.online;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.code-forge.online;
    ssl_certificate /etc/letsencrypt/live/api.code-forge.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.code-forge.online/privkey.pem;

    location / {
        proxy_pass http://platform-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name exec.code-forge.online;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name exec.code-forge.online;
    ssl_certificate /etc/letsencrypt/live/api.code-forge.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.code-forge.online/privkey.pem;

    location / {
        proxy_pass http://execution-api:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name run.code-forge.online;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name run.code-forge.online;
    ssl_certificate /etc/letsencrypt/live/api.code-forge.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.code-forge.online/privkey.pem;

    location / {
        proxy_pass http://interactive-run-api:8084;
        proxy_http_version 1.1;
        # Interactive runs are a live WebSocket, not a request/response API
        # — without this Upgrade/Connection pair nginx proxies it as a
        # plain HTTP request and the socket handshake never completes.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A run can sit idle waiting for stdin for a while — don't let
        # nginx's default 60s read timeout kill a live console session.
        proxy_read_timeout 600s;
    }
}
